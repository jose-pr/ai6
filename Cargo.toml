[workspace]
resolver = "3"
members = ["m/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/jose-pr/coagent"
publish = false

[workspace.dependencies]
# guatiao main, pinned until a release carries what these crates use.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "c68361008a0e58c644fb0a3c4cfe107114cf22e9" }
coagent-terminal-kind = { path = "m/crates/coagent-terminal-kind" }
