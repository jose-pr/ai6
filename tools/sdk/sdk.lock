# Every SDK a build of AI6 needs, and the only file to trust for them.
#
#   <group> <name> <version> <os-arch|any> <sha256|-> <url|->
#
# Two shells read this with no parser: space separated, one item a line, # for a comment.
# tools/sdk/check_lock.py checks it against the repository, and tools/sdk/README.md says how to
# change a line. A system line names what is checked and never installed; its version column is
# the group that needs it.

# Rust. The first rust line is the default toolchain: an exact stable, the newest the repository
# has been tested on. The second is the minimum, Cargo.toml's rust-version.
core rustup-init 1.29.2 windows-x64 00f139da614dced87d3c3d4121c43eebdac3c1bf8a5ee86b9d80dfd71c8d70fd https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-pc-windows-msvc/rustup-init.exe
