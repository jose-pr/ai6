name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, which is
# throwaway and deleted after its run. Not run on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: M (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The guatiao host library and the portable-pty plugin, so the suite runs every
      # watchdog case on the plugin provider too.
      - run: cargo build -p coagent-native -p coagent-terminal-pty
      - name: Point M at the native library and the plugin
        shell: bash
        run: |
          ext=so; [ "$RUNNER_OS" = macOS ] && ext=dylib
          echo "GUATIAO_LIBRARY=$PWD/target/debug/libcoagent_native.$ext" >> "$GITHUB_ENV"
          echo "COAGENT_TERMINAL_PLUGINS=$PWD/target/debug" >> "$GITHUB_ENV"
      - working-directory: m
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,guatiao]"
      - working-directory: m
        run: python -m black --check src tests
      - working-directory: m
        run: python -m pytest -q -rs
      - name: The plugin provider was loaded
        working-directory: m
        run: python -m coagent_m.watchdog providers | grep -E 'coagent_terminal_pty.* ok$'
