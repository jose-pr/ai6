name: Test

# On demand: workflow_dispatch (optionally at a ref), or a pushed "ci-*" tag, which is
# throwaway and deleted after its run. Not run on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-api:
    name: Rust public API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - name: Install cargo-public-api
        run: cargo +stable install cargo-public-api --version 0.52.0 --locked
      - name: Compare crate API snapshots
        shell: pwsh
        run: ./tools/public-api.ps1

  rust:
    name: Rust (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Provider crates build ai6 without its features; keep that build warning-free too.
      - run: cargo clippy -p ai6 --no-default-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check -p ai6-diptel --target wasm32-unknown-unknown
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

  moneypenny:
    name: Moneypenny app (Windows, Flutter main)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/moneypenny
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: subosito/flutter-action@v2
        with:
          channel: main
          cache: true
      - run: flutter config --enable-windowing
      - run: flutter pub get
      - run: dart run tool/build_guatiao_wasm.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build windows --debug
