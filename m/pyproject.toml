[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coagent-m"
version = "0.1.0.dev0"
authors = [{ name = "jose-pr" }]
description = "M: the C.O.A.G.E.N.T. supervisor daemon and agent watchdog."
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
# Terminal plugins in any language, through guatiao; pinned to a commit until a release
# carries what coagent-terminal-kind uses.
guatiao = [
    "guatiao @ git+https://github.com/Boriken-Dev/guatiao@c68361008a0e58c644fb0a3c4cfe107114cf22e9#subdirectory=bindings/python/guatiao",
]
# The Windows pseudo-console provider (a scaffold until it is implemented).
conpty = ["pywinpty>=2.0,<3; sys_platform == 'win32'"]
dev = ["black", "build", "pytest"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/coagent/"
Issues = "https://github.com/jose-pr/coagent/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/coagent_m"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
