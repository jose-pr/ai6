[package]
name = "coagent-native"
description = "The native library coagent's Python supervisor loads: guatiao's C ABI with plugin loading"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

# A cdylib exports every no_mangle symbol of the libraries linked into it, so this
# file carries the whole guatiao C surface the Python binding calls.
[lib]
crate-type = ["cdylib"]

[dependencies]
guatiao = { workspace = true, features = ["load", "provider"] }
