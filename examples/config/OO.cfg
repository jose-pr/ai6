# Outer Office's file: desktop reads it from OO_CONFIG or its configuration directory; the
# web page reads OO.cfg beside index.html. The person's own theme choice wins over this one.
[unex]
url = "http://127.0.0.1:7082"

[appearance]
theme = "night-ops"

# Moneypenny's chat, in logical pixels; the values shown are the defaults.
[chat]
min_width = 320
max_width = 720
width = 400
width_step = 16
min_page_width = 360
text_width = 960
window_width = 520
window_height = 760
transition_ms = 200
connect_timeout = 10

[routes]
text_bytes = 128

# The widest hero picture fetched, in pixels; a site on slow links sets 1920.
[art]
max_width = 3840

# How often each page asks again, in seconds; 0 turns that refresh off.
[refresh]
sessions = 3
overview = 10
timeline = 10
pools = 15
slow = 15
profile = 60
hidden = 60
# Before the access token ends the app renews it, and before the sign-in ends says so; 0 does
# neither. A failed renewal is tried again at `sessions`, or at renew_retry when that is 0.
renew_before = 600
renew_retry = 30

# Following a Mission control: seconds to wait for the Station's outcome (0 returns once it is
# queued) and between asks for its status.
[controls]
wait = 10
poll = 0.5

[pages]
timeline = 50
audit = 100

[terminal]
scrollback_lines = 10000
connect_timeout = 10
retry_delay = 1
retry_max_delay = 16

# Characters a text field takes; 0 takes the bound away.
[limits]
mission_title_chars = 512
mission_prompt_chars = 65536
reason_chars = 512

[assets]
cdn = "none"
