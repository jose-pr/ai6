# One bootstrap file for every program on a host or for a user: only what each needs before it
# reaches the configuration provider. With no [provider] location, the provider is this
# directory; the Registry is then registry/ in the reading program's state directory. See
# docs/configuration.md.

[provider]
poll = 5

# Where Universal Exports is, for its clients, and how it runs, for itself.
[unex]
url = "http://127.0.0.1:7082"
listen = "127.0.0.1:7082"
public_origin = "https://ai6.example"
station_token = { file = "station-token" }
# ca_file = "enterprise-ca.pem"

[unex.plugins]
paths = ["../../target/debug"]

[unex.access]
chief = ["account:root"]

[station]
listen = "127.0.0.1:7081"

[station.plugins]
paths = ["../../target/debug"]
