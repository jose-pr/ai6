# The Station's bootstrap file: only what it needs before it reaches its configuration
# provider. With no [provider] location, the provider is this directory; the Registry is
# then registry/ in the state directory. See docs/configuration.md.
listen = "127.0.0.1:7081"

[provider]
poll = 5

[plugins]
paths = ["../../target/debug"]

