# An example roster: copy to ~/.config/coagent/profiles.toml and edit. The launcher's
# command is whatever your agent CLI takes; {model}, {effort}, {profile}, {prompt},
# {cwd} and a profile's vars are filled in.

[launcher.cli]
command = ["agent-cli", "--model", "{model}"]
prompt = "arg"

# Claude Code, through the 00 Section's adapter (pip install -e 00/).
[launcher.claude]
adapter = "claude"
options = { mode = "print" }

[profile.nomi]
description = "Claude Code, cleared for the field."
launcher = "claude"
model = "opus"
effort = "high"
roles = ["implement", "review"]
clearance = "field"

[profile.007]
aliases = ["JamesBond"]
description = "Plans and reviews; cleared to act unattended."
launcher = "cli"
model = "<model-id>"
effort = "high"
roles = ["plan", "review"]
clearance = "00"
priority = 10

[profile.006]
aliases = ["Trevelyan"]
extends = "007"
description = "Implements, under supervision."
effort = "medium"
roles = ["implement"]
clearance = "field"
priority = 5

[profile.analyst]
launcher = "cli"
model = "<smaller-model-id>"
roles = ["docs", "triage"]
clearance = "desk"
