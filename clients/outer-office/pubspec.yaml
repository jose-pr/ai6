name: outer_office
description: AI6 Mission board for desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.15.0-173.0.dev <4.0.0"
  flutter: ">=3.51.0-1.0.pre-291"

dependencies:
  flutter:
    sdk: flutter
  # The chat's model and widgets, shared with the other agent apps; all three from one coqui-acp
  # commit, since the two packages name coqui_acp by path.
  coqui_acp:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      ref: 171e08ec92af4044377bcae77e9fb6aa391ca499
      path: bindings/dart/coqui_acp
  coqui_acp_chat:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      ref: 171e08ec92af4044377bcae77e9fb6aa391ca499
      path: bindings/dart/coqui_acp_chat
  coqui_acp_chat_ui:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      ref: 171e08ec92af4044377bcae77e9fb6aa391ca499
      path: bindings/dart/coqui_acp_chat_ui
  # Reads the frontmatter of a document by the Agent Overlay Specification's rule, which refuses
  # anchors and aliases.
  coqui_aos:
    git:
      url: https://github.com/Boriken-Dev/coqui-aos.git
      ref: c4babfd9f15347a7d35d0fc25fa28cbe398ac02f
      path: dart
  fl_chart: ^1.3.0
  flutter_svg: ^2.3.0
  guatiao:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa
      path: bindings/dart/guatiao
  guatiao_intake:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa
      path: bindings/dart/guatiao_intake
  guatiao_flutter:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa
      path: bindings/dart/guatiao_flutter
  http: ^1.6.0
  # Draws the provisioning link of a one-time code app as a QR code.
  qr: ^3.0.2
  # The Markdown parser the shared chat draws with; a document's references are a syntax of it.
  markdown: ^7.3.1
  material_ui: ^1.1.0
  shared_preferences: ^2.5.5
  # ai6.cfg: TOML, or JSON or YAML when its first line names them.
  toml: ^0.18.0
  url_launcher: ^6.3.3
  web: ^1.1.2
  web_socket_channel: ^3.0.3
  xterm2: ^5.4.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

# guatiao_intake and guatiao_flutter name guatiao and guatiao_intake as hosted packages; all
# of them come from this revision.
dependency_overrides:
  guatiao:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa
      path: bindings/dart/guatiao
  guatiao_intake:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa
      path: bindings/dart/guatiao_intake

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/backdrops/
    - assets/brand/moneypenny-128.png
    - assets/brand/outer-office-256.png
    - assets/record_forms.json
    - assets/fonts/LICENSE-Cinzel.txt
    - assets/fonts/LICENSE-Noto.txt
    - assets/fonts/LICENSE-Roboto.txt
    - assets/heroes/
    - assets/icons/
    - assets/icons/duotone/
  # Bundled so the web engine has its default font without fetching it from Google Fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # The display face of the wordmark and section labels.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
