name: outer_office
description: AI6 Mission board for desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.15.0-72.0.dev

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.3.0
  flutter_svg: ^2.3.0
  guatiao:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: fe9efd3797ec5e178e1f9381db0e65146d2c866e
      path: bindings/dart/guatiao
  guatiao_intake:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: fe9efd3797ec5e178e1f9381db0e65146d2c866e
      path: bindings/dart/guatiao_intake
  guatiao_flutter:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: fe9efd3797ec5e178e1f9381db0e65146d2c866e
      path: bindings/dart/guatiao_flutter
  http: ^1.6.0
  material_ui: ^1.1.0
  shared_preferences: ^2.5.5
  # ai6.cfg: TOML, or JSON or YAML when its first line names them.
  toml: ^0.18.0
  url_launcher: ^6.3.3
  web: ^1.1.2
  web_socket_channel: ^3.0.3
  xterm2: ^5.4.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

# guatiao_intake and guatiao_flutter name guatiao and guatiao_intake as hosted packages; all
# of them come from this revision.
dependency_overrides:
  guatiao:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: fe9efd3797ec5e178e1f9381db0e65146d2c866e
      path: bindings/dart/guatiao
  guatiao_intake:
    git:
      url: https://github.com/Boriken-Dev/guatiao.git
      ref: fe9efd3797ec5e178e1f9381db0e65146d2c866e
      path: bindings/dart/guatiao_intake

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/backdrops/
    - assets/brand/moneypenny-128.png
    - assets/brand/outer-office-256.png
    - assets/record_forms.json
    - assets/fonts/LICENSE-Cinzel.txt
    - assets/fonts/LICENSE-Noto.txt
    - assets/fonts/LICENSE-Roboto.txt
    - assets/heroes/
    - assets/icons/
    - assets/icons/duotone/
  # Bundled so the web engine has its default font without fetching it from Google Fonts.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # The display face of the wordmark and section labels.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
