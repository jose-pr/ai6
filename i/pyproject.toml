[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coagent-i"
version = "0.1.0.dev0"
authors = [{ name = "jose-pr" }]
description = "I Branch: mission briefs, the inbox and intake sources for C.O.A.G.E.N.T."
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
# The inbox in a database: SQLite, or PostgreSQL with the postgres extra.
sql = ["sqlalchemy>=2.0,<3"]
postgres = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4"]
dev = ["black", "build", "pytest", "sqlalchemy>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/jose-pr/coagent/"
Issues = "https://github.com/jose-pr/coagent/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/coagent_i"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
