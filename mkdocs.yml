site_name: AI6
site_description: AI6 is a self-hosted control plane for orchestrating coding agents.
site_url: https://jose-pr.github.io/ai6/
repo_url: https://github.com/jose-pr/ai6
repo_name: jose-pr/ai6
edit_uri: edit/main/docs/

# Constrained to docs/ so a strict build does not scan the repository's own markdown:
# the API headers and component READMEs are not pages.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Organization: organization.md
  - Guides:
      - Operations: operations.md
      - Stations and failover: stations.md
      - Theaters: theaters.md
      - Missions and intake: missions.md
      - Agents and clearance: agents.md
      - Terminals: terminals.md
      - The watchdog: watchdog.md
      - Hooks: hooks.md
      - Examples: examples.md
  - API Reference:
      # rustdoc's own output, copied under rust/ by the docs workflow. Absolute URLs
      # keep MkDocs strict mode from treating generated rustdoc pages as missing sources.
      - Rust API:
          - Overview: https://jose-pr.github.io/ai6/rust/index.html
          - ai6: https://jose-pr.github.io/ai6/rust/ai6/index.html
          - universal-exports: https://jose-pr.github.io/ai6/rust/universal_exports/index.html
          - ai6-diptel: https://jose-pr.github.io/ai6/rust/ai6_diptel/index.html
          - ai6-agent-claude: https://jose-pr.github.io/ai6/rust/ai6_agent_claude/index.html
          - ai6-agent-codex: https://jose-pr.github.io/ai6/rust/ai6_agent_codex/index.html
          - ai6-terminal-pty: https://jose-pr.github.io/ai6/rust/ai6_terminal_pty/index.html
          - ai6-safehouse-git: https://jose-pr.github.io/ai6/rust/ai6_safehouse_git/index.html
  - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
