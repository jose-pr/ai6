# coqui-acp/crates/coqui-acp-harness at c15c0ff96d4bf8b8f56aae671a6ab73f8319825a, with what it inherits written out.
example = [{ name = "spawner_host", required-features = ["kind"] }]
test = [{ name = "spawner", required-features = ["kind"] }, { name = "antigravity", required-features = ["antigravity"] }]
[package]
name = "coqui-acp-harness"
description = "Serve a coding agent's own command line as an Agent Client Protocol agent: process trees, bounded lines, neutral events, and ACP v1 and v2 shapes"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "harness", "stdio"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
antigravity = ["dep:serde", "dep:time", "dep:ureq"]
kind = ["dep:guatiao-serde"]
[dependencies]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.base64]
version = "0.22"
default-features = false
features = ["alloc"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.time]
version = "0.3"
default-features = false
features = ["parsing"]
optional = true
[dependencies.ureq]
version = "3.5"
default-features = false
features = ["rustls"]
optional = true
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
optional = true
[dependencies.serde_json]
version = "1"
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.win32job]
version = "2.0.3"
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
[dev-dependencies.coqui-acp-api]
path = "../coqui-acp-api"
features = ["contract"]
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring", "pem"]
[dev-dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dev-dependencies.time]
version = "0.3"
default-features = false
features = ["parsing", "formatting"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
