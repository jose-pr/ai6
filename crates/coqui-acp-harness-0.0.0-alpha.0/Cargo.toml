# coqui-acp/crates/coqui-acp-harness at 40196b12573f062cda1d6d3995d6afb905fe7ea9, with what it inherits written out.
example = [{ name = "spawner_host", required-features = ["kind"] }, { name = "fake_stdio_cli", required-features = ["kind"] }, { name = "stdio_provider", crate-type = ["cdylib"], required-features = ["kind"] }, { name = "agy_quota", required-features = ["antigravity"] }]
test = [{ name = "spawner", required-features = ["kind"] }, { name = "account", required-features = ["kind"] }, { name = "opencode", required-features = ["kind"] }, { name = "stdio", required-features = ["kind"] }, { name = "replay", required-features = ["kind"] }, { name = "antigravity", required-features = ["antigravity"] }, { name = "agy_login", required-features = ["antigravity"] }, { name = "login_forms", required-features = ["kind"] }, { name = "signed_in", required-features = ["kind"] }]
[package]
name = "coqui-acp-harness"
description = "Serve a coding agent's own command line as an Agent Client Protocol agent: process trees, bounded lines, neutral events, and ACP v1 and v2 shapes"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "harness", "stdio"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
antigravity = ["dep:serde", "dep:time", "dep:ureq", "dep:windows-sys", "dep:memchr", "keyring"]
keyring = ["dep:keyring-core", "dep:windows-native-keyring-store", "dep:apple-native-keyring-store", "dep:zbus-secret-service-keyring-store", "dep:security-framework", "dep:sha2", "dep:data-encoding"]
kind = ["dep:guatiao-serde", "dep:coqui-acp-history"]
[dependencies]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.base64]
version = "0.22"
default-features = false
features = ["alloc"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.time]
version = "0.3"
default-features = false
features = ["parsing"]
optional = true
[dependencies.ureq]
version = "3.5"
default-features = false
features = ["rustls"]
optional = true
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
default-features = false
optional = true
[dependencies.coqui-acp-history]
path = "../coqui-acp-history"
optional = true
[dependencies.serde_json]
version = "1"
[dependencies.tracing]
version = "0.1"
default-features = false
features = ["std"]
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[dependencies.memchr]
version = "2"
optional = true
[dependencies.keyring-core]
version = "1"
optional = true
[dependencies.sha2]
version = "0.11"
default-features = false
optional = true
[dependencies.data-encoding]
version = "2"
default-features = false
features = ["alloc"]
optional = true
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
[target."cfg(all(unix, not(any(target_os = \"macos\", target_os = \"ios\", target_os = \"android\"))))"]
[target."cfg(all(unix, not(any(target_os = \"macos\", target_os = \"ios\", target_os = \"android\"))))".dependencies]
[target."cfg(all(unix, not(any(target_os = \"macos\", target_os = \"ios\", target_os = \"android\"))))".dependencies.zbus-secret-service-keyring-store]
version = "1"
optional = true
features = ["crypto-rust"]
[target."cfg(target_os = \"macos\")"]
[target."cfg(target_os = \"macos\")".dependencies]
[target."cfg(target_os = \"macos\")".dependencies.apple-native-keyring-store]
version = "1"
optional = true
features = ["keychain"]
[target."cfg(target_os = \"macos\")".dependencies.security-framework]
version = "3.7"
optional = true
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.win32job]
version = "2.0.3"
[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
optional = true
default-features = false
features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"]
[target."cfg(windows)".dependencies.windows-native-keyring-store]
version = "1"
optional = true
default-features = false
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
features = ["secret"]
[dev-dependencies.coqui-acp-api]
path = "../coqui-acp-api"
features = ["contract"]
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
default-features = false
features = ["json"]
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring", "pem"]
[dev-dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dev-dependencies.time]
version = "0.3"
default-features = false
features = ["parsing", "formatting"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
