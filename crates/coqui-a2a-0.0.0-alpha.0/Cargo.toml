# coqui-a2a/crates/coqui-a2a at c951d778f95a5c5118406e371af835c73c10273c, with what it inherits written out.
bin = [{ name = "coqui-a2a", path = "src/main.rs", required-features = ["cli"] }]
[package]
name = "coqui-a2a"
description = "A2A over a link a peer has proved (cabuya), as a custom protocol binding, with a loopback HTTP command for unmodified A2A software"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-a2a"
homepage = "https://boriken-dev.github.io/coqui-a2a/"
readme = "README.md"
keywords = ["a2a", "agent", "peer", "protocol-binding"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
tasks = []
loopback = ["cabuya/forward", "dep:axum", "dep:tokio", "dep:futures-util", "dep:hyper", "dep:hyper-util", "dep:subtle", "serde_json/raw_value"]
cli = ["loopback", "cabuya/sealed", "dep:agentic-peer", "dep:clap", "dep:coqui-peer", "dep:coqui-peer-webcrypto", "dep:coqui-peer-tls", "dep:rustls", "dep:url", "dep:coqui-transport-web"]
[dependencies]
serde_json = "1"
[dependencies.cabuya]
git = "https://github.com/Boriken-Dev/cabuya"
rev = "7089185fbd047b676ba9a74963b7509136f4637a"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.time]
version = "0.3"
default-features = false
features = ["std", "formatting", "parsing"]
[dependencies.axum]
version = "0.8"
default-features = false
features = ["tokio", "json"]
optional = true
[dependencies.tokio]
version = "1"
default-features = false
features = ["rt-multi-thread", "net", "sync", "time"]
optional = true
[dependencies.futures-util]
version = "0.3"
default-features = false
optional = true
[dependencies.hyper]
version = "1"
default-features = false
features = ["http1", "server"]
optional = true
[dependencies.hyper-util]
version = "0.1"
default-features = false
features = ["tokio", "service"]
optional = true
[dependencies.subtle]
version = "2.6"
default-features = false
optional = true
[dependencies.clap]
version = "4"
features = ["derive", "env"]
optional = true
[dependencies.agentic-peer]
git = "https://github.com/Boriken-Dev/agentic-peer"
rev = "89a89b7fce9818476aaeea020d2a518188957a70"
optional = true
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "7544cf9c026da808dc940bcb56a0b3d5d78bef2f"
optional = true
[dependencies.coqui-transport-web]
git = "https://github.com/Boriken-Dev/coqui-transport-web"
rev = "c24a35d19df3867e222cb458bce2ad782d98c1eb"
features = ["websocket"]
optional = true
[dependencies.coqui-peer]
version = "=0.0.0-alpha.1"
optional = true
[dependencies.coqui-peer-tls]
version = "=0.0.0-alpha.1"
optional = true
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true
[dependencies.url]
version = "2.5"
optional = true
[dev-dependencies]
proptest = "1"
url = "2.5"
[dev-dependencies.cabuya]
git = "https://github.com/Boriken-Dev/cabuya"
rev = "7089185fbd047b676ba9a74963b7509136f4637a"
features = ["sealed", "forward"]
[dev-dependencies.coqui-acp]
git = "https://github.com/Boriken-Dev/coqui-acp"
rev = "40196b12573f062cda1d6d3995d6afb905fe7ea9"
[dev-dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "7544cf9c026da808dc940bcb56a0b3d5d78bef2f"
features = ["pin"]
[dev-dependencies.coqui-transport-web]
git = "https://github.com/Boriken-Dev/coqui-transport-web"
rev = "c24a35d19df3867e222cb458bce2ad782d98c1eb"
features = ["websocket"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
