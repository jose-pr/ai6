# coqui-transport-web/. at c8df84264ff8e60907f5cedf269104e91d5add22, with what it inherits written out.
example = [{ name = "echo", required-features = ["websocket", "webtransport"] }, { name = "ladder", required-features = ["webrtc"] }]
test = [{ name = "ladder", required-features = ["webrtc"] }, { name = "ladder_idle", required-features = ["webrtc"] }, { name = "ladder_peers", required-features = ["webrtc"] }]
[package]
name = "coqui-transport-web"
version = "0.0.0-alpha.0"
description = "WebSocket, WebTransport and WebRTC data channels as coqui-transport channels a browser can open natively, with endpoint validation and a safe fallback between them"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-transport-web"
homepage = "https://boriken-dev.github.io/coqui-transport-web/"
keywords = ["webtransport", "websocket", "webrtc", "fallback", "transport"]
categories = ["network-programming", "web-programming::websocket"]
exclude = [".*", "*.local.*", "/bindings/", "/tools/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
websocket = ["dep:tungstenite", "dep:rustls", "dep:mio", "dep:socket2"]
webtransport = ["dep:wtransport", "dep:tokio", "dep:rustls"]
webrtc = ["websocket", "webtransport", "dep:str0m"]
[dependencies]
url = "2.5"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "1283116a22de6a8918faa3d0ebd78b8b6777ff0a"
default-features = false
[dependencies.tungstenite]
version = "0.30"
optional = true
default-features = false
features = ["handshake"]
[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["ring", "std", "tls12"]
[dependencies.mio]
version = "1"
optional = true
default-features = false
features = ["os-poll", "net"]
[dependencies.socket2]
version = "0.6"
optional = true
[dependencies.wtransport]
version = "0.7.2"
optional = true
default-features = false
features = ["quinn", "ring"]
[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["rt-multi-thread", "time", "sync", "macros"]
[dependencies.str0m]
version = "0.24"
optional = true
default-features = false
features = ["rust-crypto"]
[dev-dependencies]
toml = "=1.1.8"
serde_json = "1"
url = "2.5"
time = "0.3"
hmac = "0.12"
sha1 = "0.10"
bytes = "1"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
[dev-dependencies.proptest]
version = "1"
default-features = false
features = ["std"]
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring", "pem"]
[dev-dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dev-dependencies.wtransport]
version = "0.7.2"
default-features = false
features = ["quinn", "ring"]
[dev-dependencies.quinn]
version = "0.11"
default-features = false
features = ["bloom"]
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["rt", "time"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
