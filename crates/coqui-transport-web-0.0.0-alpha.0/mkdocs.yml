site_name: coqui-transport-web
site_description: WebSocket, WebTransport and WebRTC data channels as coqui-transport channels a browser can open natively.
site_url: https://boriken-dev.github.io/coqui-transport-web/
repo_url: https://github.com/Boriken-Dev/coqui-transport-web
repo_name: Boriken-Dev/coqui-transport-web
edit_uri: edit/main/docs/

# Constrained to docs/ so a strict build does not scan the repository's own markdown.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Choosing a transport: fallback.md
