# coqui-acp/crates/coqui-acp-bridge at 171e08ec92af4044377bcae77e9fb6aa391ca499, with what it inherits written out.
[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[dependencies]
url = "2.5"
[dependencies.clap]
version = "4"
features = ["derive"]
[dependencies.cabuya]
git = "https://github.com/Boriken-Dev/cabuya"
rev = "5fb2a34cb2b3fb5b289b6958c145a5f124ff5879"
features = ["sealed", "forward"]
[dependencies.agentic-peer]
git = "https://github.com/Boriken-Dev/agentic-peer"
rev = "19414c27507dfd35d10552159463b5b7cea11c39"
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f"
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "d5e8cc4792f7d6e69921822da59ee6e10324cb9a"
features = ["pin"]
[dependencies.coqui-peer-tls]
version = "=0.0.0-alpha.1"
features = ["generate", "ca"]
[dependencies.coqui-net-acl]
version = "=0.0.0-alpha.0"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[dependencies.coqui-transport-web]
git = "https://github.com/Boriken-Dev/coqui-transport-web"
rev = "51ec0f127dbba5100ea709d36724e49c4829c351"
features = ["websocket", "webtransport"]
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dependencies.serde_json]
version = "1"
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
win32job = "2.0.3"
[dev-dependencies]
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring", "pem"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
