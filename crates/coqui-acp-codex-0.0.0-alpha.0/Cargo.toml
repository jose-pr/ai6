# coqui-acp/crates/coqui-acp-codex at 981a64ad05a4039f674d9ca204bf4aaeb6db7398, with what it inherits written out.
bin = [{ name = "coqui-acp-codex", path = "src/main.rs" }]
[package]
name = "coqui-acp-codex"
description = "Codex as an Agent Client Protocol agent, in Rust: a driver for its app-server protocol and an ACP agent on it, with no Node"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "codex", "app-server"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
[dependencies.clap]
version = "4"
features = ["derive", "env"]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.coqui-acp-harness]
path = "../coqui-acp-harness"
[dependencies.serde_json]
version = "1"
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
