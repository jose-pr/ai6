# coqui-access/providers/access/mtls at 89e4356e8123b8e4d597094e752344bc476f5084, with what it inherits written out.
[package]
name = "coqui-access-mtls"
description = "Map verified peer certificate fingerprints to directory identities, with account management"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-access-kit]
path = "crates/coqui-access-kit"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f"
[dependencies.coqui-peer-tls]
git = "https://github.com/Boriken-Dev/coqui-peer-tls"
rev = "124f700c3d5ce8c335e838aacd2d1d1b42947214"
features = ["ca"]
[dependencies.coqui-access-claims]
path = "crates/coqui-access-claims"
[dev-dependencies]
[dev-dependencies.coqui-peer-tls]
git = "https://github.com/Boriken-Dev/coqui-peer-tls"
rev = "124f700c3d5ce8c335e838aacd2d1d1b42947214"
features = ["ca", "generate"]
[dev-dependencies.rcgen]
version = "0.14"
[dev-dependencies.tempfile]
version = "3"
