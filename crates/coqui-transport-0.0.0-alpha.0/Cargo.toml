# coqui-transport/. at 1283116a22de6a8918faa3d0ebd78b8b6777ff0a, with what it inherits written out.
test = [{ name = "asynch", required-features = ["tokio"] }, { name = "stdio", harness = false }]
example = [{ name = "async_tcp", required-features = ["tokio"] }]
[package]
name = "coqui-transport"
version = "0.0.0-alpha.0"
description = "Streams, message channels and datagrams over any transport: the channel contract, explicit framing codecs, a stream-to-channel adapter, and memory, stdio and TCP adapters"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-transport"
homepage = "https://boriken-dev.github.io/coqui-transport/"
keywords = ["transport", "channel", "framing", "stream", "datagram"]
categories = ["network-programming", "asynchronous"]
exclude = [".*", "*.local.*", "/tools/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
tokio = ["dep:tokio"]
[dependencies]
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.tokio]
version = "1"
default-features = false
features = ["io-util", "net", "sync", "time"]
optional = true
[dev-dependencies]
serde_json = "1"
toml = "=1.1.8"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
[dev-dependencies.proptest]
version = "1"
default-features = false
features = ["std"]
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
