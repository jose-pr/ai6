# coqui-aos/rust at 5176974f30f664a4a9c382fdd467d4a1ab87765b, with what it inherits written out.
test = [{ name = "tree", required-features = ["fs"] }]
[package]
name = "coqui-aos"
version = "0.0.0-alpha.0"
description = "The Agent Overlay Specification (AOS) in Rust: reading overlays, validating manifests, tree digests, composition and the environment an overlay builds, through a filesystem trait the caller supplies"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-aos"
homepage = "https://boriken-dev.github.io/coqui-aos/"
keywords = ["aos", "agent", "overlay", "manifest", "configuration"]
categories = ["config", "parser-implementations"]
exclude = [".*", "*.local.*", "/tests/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = ["fs"]
fs = []
test-support = ["dep:base64"]
serde = ["dep:serde"]
[dependencies]
unicode-general-category = "1"
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
features = ["derive"]
[dependencies.granit-parser]
version = "2"
default-features = false
features = ["std"]
[dependencies.serde_json]
version = "1"
features = ["preserve_order"]
[dependencies.base64]
version = "0.22"
optional = true
[dependencies.serde]
version = "1"
default-features = false
features = ["alloc", "derive"]
optional = true
[dependencies.sha2]
version = "0.10"
default-features = false
[dependencies.toml]
version = "1"
default-features = false
features = ["std", "parse", "serde", "preserve_order"]
[dev-dependencies]
tempfile = "3"
[dev-dependencies.coqui-aos]
path = "."
default-features = false
features = ["test-support", "serde"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
