# coqui-aos/rust at b766c775b0600cdec6f5695cdaad8dffe64790e9, with what it inherits written out.
test = [{ name = "tree", required-features = ["fs"] }, { name = "knowledge_index", required-features = ["index"] }]
[package]
name = "coqui-aos"
version = "0.0.0-alpha.0"
description = "The Agent Overlay Specification (AOS) in Rust: reading overlays, validating manifests, tree digests, composition and the environment an overlay builds, through a filesystem trait the caller supplies"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-aos"
homepage = "https://boriken-dev.github.io/coqui-aos/"
keywords = ["aos", "agent", "overlay", "manifest", "configuration"]
categories = ["config", "parser-implementations"]
exclude = [".*", "*.local.*", "/tests/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = ["fs"]
fs = []
test-support = ["dep:base64"]
serde = ["dep:serde"]
index = ["dep:serde", "dep:globset", "dep:data-encoding"]
embeddings = ["index", "dep:ureq"]
[dependencies]
unicode-general-category = "1"
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
default-features = false
features = ["derive"]
[dependencies.granit-parser]
version = "2"
default-features = false
features = ["std"]
[dependencies.serde_json]
version = "1"
features = ["preserve_order"]
[dependencies.base64]
version = "0.22"
optional = true
[dependencies.serde]
version = "1"
default-features = false
features = ["alloc", "derive"]
optional = true
[dependencies.sha2]
version = "0.10"
default-features = false
[dependencies.tplx-rs]
git = "https://github.com/jose-pr/tplx-rs"
rev = "0298ec416a1676d088abf4f8519812ec4b5eb1e1"
default-features = false
[dependencies.globset]
version = "0.4"
default-features = false
optional = true
[dependencies.data-encoding]
version = "2"
default-features = false
features = ["std"]
optional = true
[dependencies.ureq]
version = "3.5"
default-features = false
features = ["rustls", "platform-verifier"]
optional = true
[dependencies.toml]
version = "1"
default-features = false
features = ["std", "parse", "serde", "preserve_order"]
[dev-dependencies]
tempfile = "3"
[dev-dependencies.coqui-aos]
path = "."
default-features = false
features = ["test-support", "serde"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
