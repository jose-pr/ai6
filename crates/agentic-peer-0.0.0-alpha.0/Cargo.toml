# agentic-peer/crates/agentic-peer at 19414c27507dfd35d10552159463b5b7cea11c39, with what it inherits written out.
[package]
name = "agentic-peer"
description = "What an agent needs around a proven link: a home for the identity, finding a peer, the browser companion, MCP offered to a program"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/agentic-peer"
homepage = "https://boriken-dev.github.io/agentic-peer/"
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[dependencies]
mdns-sd = "0.21"
serde_json = "1"
url = "2.5"
[dependencies.cabuya]
git = "https://github.com/Boriken-Dev/cabuya"
rev = "5fb2a34cb2b3fb5b289b6958c145a5f124ff5879"
features = ["sealed"]
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "d5e8cc4792f7d6e69921822da59ee6e10324cb9a"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
