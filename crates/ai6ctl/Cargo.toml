[package]
name = "ai6ctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Operator command for the AI6 Universal Exports API"
readme = "README.md"
exclude = [".*", "*.local.*"]

[dependencies]
# The bootstrap file's [unex] url and ca_file; no features, so none of the Station comes with it.
ai6 = { path = "../ai6" }
clap = { workspace = true, features = ["env", "error-context", "suggestions"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "time"] }
# `attach`: the WebSocket to the gateway, over TLS the way the HTTP client is (public roots and
# the bootstrap file's `ca_file`).
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
futures-util = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
ai6 = { path = "../ai6", features = ["sqlite"] }
axum = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
universal-exports = { path = "../universal-exports" }
ai6-diptel = { path = "../ai6-diptel" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
