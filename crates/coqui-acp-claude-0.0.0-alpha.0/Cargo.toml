# coqui-acp/crates/coqui-acp-claude at 40196b12573f062cda1d6d3995d6afb905fe7ea9, with what it inherits written out.
example = [{ name = "claude_provider", crate-type = ["cdylib"] }]
[package]
name = "coqui-acp-claude"
description = "Claude Code as an Agent Client Protocol agent, in Rust: a driver for its stream-json protocol and an ACP agent on it, with no Node"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "claude", "stream-json"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
history = ["dep:coqui-acp-history"]
[dependencies]
[dependencies.clap]
version = "4"
features = ["derive", "env"]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
features = ["reader"]
[dependencies.coqui-acp-harness]
path = "../coqui-acp-harness"
features = ["kind", "keyring"]
[dependencies.serde_json]
version = "1"
[dependencies.coqui-acp-history]
path = "../coqui-acp-history"
optional = true
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
[dev-dependencies.coqui-acp-api]
path = "../coqui-acp-api"
features = ["contract"]
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
default-features = false
features = ["json"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
