# coqui-net-acl/. at 839435acc29b76ec0190b7099f870863313d3fcd, with what it inherits written out.
[package]
name = "coqui-net-acl"
version = "0.0.0-alpha.0"
description = "Ordered, first-match access control lists over source networks, with pre-read and post-handshake evaluation"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-net-acl"
homepage = "https://boriken-dev.github.io/coqui-net-acl/"
keywords = ["acl", "access-control", "firewall", "cidr", "network"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "/tools/"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
serde = ["dep:serde"]
describe = ["dep:coqui-builder"]
[dependencies]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
default-features = false
features = ["derive"]
optional = true
[dev-dependencies]
toml = "0.9"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
default-features = false
features = ["derive", "serde"]
