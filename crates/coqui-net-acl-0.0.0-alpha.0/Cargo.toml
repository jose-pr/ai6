# coqui-net-acl/. at 6cbcb4b937ea1902291aaf1636d4d6bd391adc3a, with what it inherits written out.
[package]
name = "coqui-net-acl"
version = "0.0.0-alpha.0"
description = "Ordered, first-match access control lists over source networks, with pre-read and post-handshake evaluation"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-net-acl"
homepage = "https://boriken-dev.github.io/coqui-net-acl/"
keywords = ["acl", "access-control", "firewall", "cidr", "network"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "/tools/"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
serde = ["dep:serde"]
guatiao = ["dep:guatiao"]
[dependencies]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
features = ["derive"]
optional = true
[dev-dependencies]
toml = "0.9"
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
features = ["json", "toml", "yaml"]
