# coqui-access/crates/coqui-access at ce68969a397073dcef0a37fb00a83888b767e273, with what it inherits written out.
[package]
name = "coqui-access"
description = "Authentication, directory, authorization and account-management kinds, and the models that cross them"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[dependencies]
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
features = ["provider"]
[dev-dependencies]
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
features = ["json"]
