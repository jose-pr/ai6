# One bootstrap file for a host running a Station, a gateway and ai6ctl. The test suites of
# crates/ai6, crates/universal-exports and crates/ai6ctl each start their program from this text.

[provider]
location = "config"
poll = 0

[registry]
location = "registry"

[unex]
url = "UNEX_URL"
station_token = { provider = "file", key = "station-token" }
listen = "GATEWAY_LISTEN"
public_origin = "https://localhost"
state_dir = "unex-state"

[unex.plugins]
paths = []

[unex.access]
chief = ["account:root"]

[unex.pages]
dir = "pages"

[station]
id = "one-file"
state_dir = "station-state"
listen = "STATION_LISTEN"

[station.plugins]
paths = []

[station.identity]
dir = "station-identity"

[station.secrets]
dir = "station-secrets"

[oo.appearance]
theme = "night-ops"
