[package]
name = "ai6"
description = "The AI6 Mission daemon and command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*"]

[features]
default = []
# The Station and the field runner (`ai6::station::runner`), which a Station reaches over HTTP.
daemon = ["gate", "dep:axum", "dep:tokio", "dep:subtle", "dep:futures-util", "dep:sysinfo", "dep:ring", "guatiao/load"]
# The harness gate's client of a Station's Cable endpoint (`ai6::directorates::section_00::gate`).
gate = ["dep:ureq"]
# Adds bounded background event publication to the Universal Exports gateway.
publisher = ["daemon", "dep:ai6-diptel", "dep:url"]
cables-mcp = ["daemon", "dep:rmcp", "dep:schemars"]
station-tls = ["dep:coqui-peer-tls", "dep:rustls"]
# A Registry and roster kept in a SQLite database file.
sqlite = ["dep:rusqlite"]
# A Registry and roster kept in PostgreSQL, shared by every Station of an HA deployment.
postgres = ["dep:tokio-postgres", "dep:tokio", "tokio/sync", "tokio/time", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs"]
cli = ["daemon", "publisher", "cables-mcp", "station-tls", "sqlite", "postgres", "dep:clap", "tokio/signal"]

[[bin]]
name = "ai6"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "ha"
path = "tests/ha.rs"
required-features = ["cli"]

[dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
coqui-access.workspace = true
coqui-roles.workspace = true
guatiao = { workspace = true, features = ["provider"] }
fs2 = "0.4"
futures-util = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc"] }
serde_json.workspace = true
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha2.workspace = true
coqui-peer = { workspace = true, features = ["serde"] }
# Ed25519 for publisher signatures on provider libraries; already built for rustls.
ring = { version = "0.17.14", optional = true }
coqui-peer-tls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
globset.workspace = true
lru.workspace = true
rusqlite = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
regex.workspace = true
subtle = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
ai6-diptel = { path = "../ai6-diptel", optional = true }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
rcgen.workspace = true
data-encoding = { workspace = true, features = ["alloc"] }
# The access plugins are libraries to load, never to link: depending on them has Cargo build
# each one beside the test binaries, where the plugin tests scan for them.
coqui-access-key-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
coqui-access-ldap-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
coqui-access-local-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
coqui-access-peer-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
coqui-access-proxy-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
coqui-roles-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "d5146346951ec011a7332f04fff9e4863635152d" }
