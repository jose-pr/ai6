# coqui-peer-tls/. at 7cbd7ee208595c055d74eed79a4dafcd0175883d, with what it inherits written out.
[package]
name = "coqui-peer-tls"
version = "0.0.0-alpha.1"
description = "The TLS method of coqui-peer: mutual-TLS identity with pinned, CA and key-proof trust, policy profiles and encrypted streams"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-tls"
homepage = "https://boriken-dev.github.io/coqui-peer-tls/"
keywords = ["tls", "mtls", "rustls", "peer", "pinning"]
categories = ["cryptography", "network-programming", "authentication"]
exclude = [".*", "*.local.*", "/tools/"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
features = ["generate", "ca", "tokio", "pin", "serde", "acl", "platform-roots", "fields", "aws-lc"]
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
generate = ["dep:rcgen", "dep:time"]
ca = ["fields", "dep:globset"]
fields = ["dep:x509-parser"]
tokio = ["dep:tokio", "dep:tokio-rustls", "coqui-peer/tokio"]
pin = ["coqui-peer/pin"]
serde = ["dep:serde", "coqui-builder/serde", "coqui-peer/serde"]
acl = ["dep:coqui-net-acl", "coqui-net-acl/describe"]
platform-roots = ["dep:rustls-platform-verifier"]
aws-lc = ["rustls/aws_lc_rs", "webpki/aws-lc-rs"]
fips = ["aws-lc", "rustls/fips"]
[dependencies]
[dependencies.coqui-peer]
version = "=0.0.0-alpha.1"
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.rustls]
version = "0.23.27"
default-features = false
features = ["std", "ring", "tls12"]
[dependencies.webpki]
package = "rustls-webpki"
version = "0.103"
default-features = false
features = ["ring"]
[dependencies.coqui-net-acl]
version = "0.0.0-alpha.0"
git = "https://github.com/Boriken-Dev/coqui-net-acl"
rev = "839435acc29b76ec0190b7099f870863313d3fcd"
optional = true
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.rcgen]
version = "0.14"
default-features = false
features = ["crypto", "pem", "ring"]
optional = true
[dependencies.time]
version = "0.3.6"
default-features = false
optional = true
[dependencies.x509-parser]
version = "0.18"
default-features = false
optional = true
[dependencies.globset]
version = "0.4"
default-features = false
optional = true
[dependencies.tokio]
version = "1"
default-features = false
features = ["net", "io-util", "time"]
optional = true
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true
[dependencies.rustls-platform-verifier]
version = "0.7.1"
default-features = false
optional = true
[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
serde_json = "1"
toml = "0.9"
x509-parser = "0.18"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["macros", "net", "rt", "io-util", "time"]
[dev-dependencies.quinn]
version = "0.11.9"
default-features = false
features = ["rustls-ring", "runtime-tokio"]
