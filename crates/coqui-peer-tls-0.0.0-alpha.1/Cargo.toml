# coqui-peer-tls/. at e5c1e6df27260ba3b4cec0a1ad5e37a04652e5f4, with what it inherits written out.
[package]
name = "coqui-peer-tls"
version = "0.0.0-alpha.1"
description = "The TLS method of coqui-peer: mutual-TLS identity with pinned, CA and key-proof trust, policy profiles and encrypted streams"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-tls"
homepage = "https://boriken-dev.github.io/coqui-peer-tls/"
keywords = ["tls", "mtls", "rustls", "peer", "pinning"]
categories = ["cryptography", "network-programming", "authentication"]
exclude = [".*", "*.local.*", "/tools/"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
features = ["generate", "ca", "tokio", "pin", "serde", "acl", "platform-roots", "fields", "aws-lc"]
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
generate = ["dep:rcgen", "dep:time"]
ca = ["fields", "dep:globset"]
fields = ["dep:x509-parser"]
tokio = ["dep:tokio", "dep:tokio-rustls", "coqui-peer/tokio"]
pin = ["coqui-peer/pin"]
serde = ["dep:serde", "dep:guatiao-serde", "coqui-peer/serde"]
acl = ["dep:coqui-net-acl"]
platform-roots = ["dep:rustls-platform-verifier"]
aws-lc = ["rustls/aws_lc_rs", "webpki/aws-lc-rs"]
fips = ["aws-lc", "rustls/fips"]
[dependencies]
[dependencies.coqui-peer]
version = "=0.0.0-alpha.1"
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "381e2a8144a228e592dc7d82eeb7db85885422ec"
[dependencies.rustls]
version = "0.23.27"
default-features = false
features = ["std", "ring", "tls12"]
[dependencies.webpki]
package = "rustls-webpki"
version = "0.103"
default-features = false
features = ["ring"]
[dependencies.coqui-net-acl]
version = "0.0.0-alpha.0"
git = "https://github.com/Boriken-Dev/coqui-net-acl"
rev = "6cbcb4b937ea1902291aaf1636d4d6bd391adc3a"
features = ["guatiao"]
optional = true
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
features = ["derive"]
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
optional = true
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.rcgen]
version = "0.14"
default-features = false
features = ["crypto", "pem", "ring"]
optional = true
[dependencies.time]
version = "0.3.6"
default-features = false
optional = true
[dependencies.x509-parser]
version = "0.18"
default-features = false
optional = true
[dependencies.globset]
version = "0.4"
default-features = false
optional = true
[dependencies.tokio]
version = "1"
default-features = false
features = ["net", "io-util", "time"]
optional = true
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true
[dependencies.rustls-platform-verifier]
version = "0.7.1"
default-features = false
optional = true
[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
serde_json = "1"
toml = "0.9"
x509-parser = "0.18"
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
features = ["json", "toml", "yaml"]
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["macros", "net", "rt", "io-util", "time"]
[dev-dependencies.quinn]
version = "0.11.9"
default-features = false
features = ["rustls-ring", "runtime-tokio"]
