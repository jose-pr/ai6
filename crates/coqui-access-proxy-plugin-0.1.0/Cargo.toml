# coqui-access/providers/access/proxy/plugin at 89e4356e8123b8e4d597094e752344bc476f5084, with what it inherits written out.
[package]
name = "coqui-access-proxy-plugin"
description = "coqui-access-proxy as a library a host loads"
version = "0.1.0"
edition = "2024"
