# coqui-peer-webcrypto/. at 9146f55dd9fb9be8d6d96f43e17bc7a057ba0681, with what it inherits written out.
test = [{ name = "pair", required-features = ["pin"] }]
[package]
name = "coqui-peer-webcrypto"
version = "0.0.0-alpha.0"
description = "The WebCrypto method of coqui-peer: mutual P-256 key proof, in a browser or natively, ending in an encrypted session"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
homepage = "https://boriken-dev.github.io/coqui-peer-webcrypto/"
keywords = ["webcrypto", "peer", "p256", "handshake", "browser"]
categories = ["cryptography", "authentication", "network-programming"]
exclude = [".*", "*.local.*", "/bindings/", "/tools/"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
pin = ["coqui-peer/pin"]
[dependencies]
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.p256]
version = "0.14"
default-features = false
features = ["alloc", "ecdsa", "ecdh", "pkcs8"]
[dependencies.aes-gcm]
version = "0.11"
default-features = false
features = ["aes", "alloc", "zeroize"]
[dependencies.hkdf]
version = "0.13"
default-features = false
[dependencies.sha2]
version = "0.11.1"
default-features = false
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.data-encoding]
version = "2"
default-features = false
features = ["alloc"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.serde_json]
version = "1"
default-features = false
features = ["std"]
[dependencies.getrandom]
version = "0.4"
default-features = false
[dependencies.zeroize]
version = "1"
default-features = false
features = ["alloc"]
[dev-dependencies]
tempfile = "3"
toml = "=1.1.8"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
