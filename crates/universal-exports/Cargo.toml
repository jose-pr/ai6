[package]
name = "universal-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Authenticated public API gateway for AI6 agent sessions"
readme = "README.md"
exclude = [".*", "*.local.*"]

[features]
default = []
cli = ["ai6/daemon", "ai6/sqlite", "ai6/postgres", "dep:clap", "dep:coqui-access-kit", "tokio/signal"]

[[bin]]
name = "universal-exports"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "access"
path = "tests/access.rs"
required-features = ["cli"]

[dependencies]
ai6 = { path = "../ai6" }
coqui-access-kit = { workspace = true, optional = true }
axum = { workspace = true, features = ["form", "matched-path", "original-uri", "tower-log", "ws"] }
clap = { workspace = true, optional = true, features = ["env", "error-context", "suggestions"] }
futures-util = { workspace = true }
governor = { workspace = true }
guatiao = { workspace = true }
ai6-diptel = { path = "../ai6-diptel" }
roxmltree = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
similar = { workspace = true }
sha2 = { workspace = true, features = ["alloc"] }
hmac = { workspace = true }
coqui-peer = { workspace = true }
# Constant-time comparison of secrets.
subtle = { workspace = true }
base64 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tower = { workspace = true }
uuid = { workspace = true, features = ["std"] }
# A2A times, ISO 8601 in UTC.
time = { workspace = true, features = ["formatting"] }
coqui-a2a = { workspace = true }
coqui-agentic-peer = { workspace = true }
coqui-web-channel = { workspace = true }
# A peer's url, and the public roots a wss:// peer is dialed with.
url = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
# The loopback HTTP endpoint unmodified A2A clients use, driven against Liaison in its tests.
coqui-a2a = { workspace = true, features = ["loopback"] }
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
# Libraries to load, never to link: depending on them has Cargo build each beside the test
# binaries, where the page tests load the real page authenticators.
coqui-access-mtls-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "af03569c43e1abc6599b95366e6df99bc88234b9" }
coqui-access-proxy-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "af03569c43e1abc6599b95366e6df99bc88234b9" }
