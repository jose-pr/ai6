[package]
name = "universal-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Authenticated public API gateway for AI6 agent sessions"
readme = "README.md"
exclude = [".*", "*.local.*"]

[features]
default = []
cli = ["ai6/daemon", "ai6/sqlite", "ai6/postgres", "dep:clap", "dep:coqui-access-kit", "tokio/signal"]

[[bin]]
name = "universal-exports"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
ai6 = { path = "../ai6" }
coqui-access-kit = { workspace = true, optional = true }
axum = { workspace = true, features = ["form", "matched-path", "original-uri", "tower-log", "ws"] }
clap = { workspace = true, optional = true, features = ["env", "error-context", "suggestions"] }
futures-util = { workspace = true }
governor = { workspace = true }
guatiao = { workspace = true }
ai6-diptel = { path = "../ai6-diptel" }
roxmltree = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["sync", "time"] }
tower = { workspace = true }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
