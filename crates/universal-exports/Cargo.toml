[package]
name = "universal-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Authenticated public API gateway for AI6 agent runs"
readme = "README.md"
exclude = [".*", "*.local.*"]

[features]
default = []
cli = ["ai6/daemon", "ai6/sqlite", "ai6/postgres", "dep:clap", "tokio/signal"]

[[bin]]
name = "universal-exports"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "access"
path = "tests/access.rs"
required-features = ["cli"]

[[test]]
name = "keys"
path = "tests/keys.rs"
required-features = ["cli"]

[[test]]
name = "sign_in"
path = "tests/sign_in.rs"
required-features = ["cli"]

[dependencies]
ai6 = { path = "../ai6" }
coqui-access-kit = { workspace = true }
coqui-access-totp = { workspace = true }
coqui-access-signin = { workspace = true }
axum = { workspace = true, features = ["form", "matched-path", "original-uri", "tower-log", "ws"] }
clap = { workspace = true, optional = true, features = ["env", "error-context", "suggestions"] }
futures-util = { workspace = true }
governor = { workspace = true }
guatiao = { workspace = true }
guatiao-serde = { workspace = true, features = ["json"] }
ai6-diptel = { path = "../ai6-diptel" }
roxmltree = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
similar = { workspace = true }
sha2 = { workspace = true, features = ["alloc"] }
hmac = { workspace = true }
# Seals one-time code secrets with AES-256-GCM.
ring = "0.17.14"
coqui-peer = { workspace = true }
# Constant-time comparison of secrets.
subtle = { workspace = true }
base64 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tower = { workspace = true }
uuid = { workspace = true, features = ["std"] }
# A2A times, ISO 8601 in UTC.
time = { workspace = true, features = ["formatting"] }
coqui-a2a = { workspace = true }
coqui-agentic-peer = { workspace = true }
coqui-transport-web = { workspace = true }
# A peer's url, and the public roots a wss:// peer is dialed with.
url = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
# The shared sign-in vectors every consumer of the policy runs.
coqui-access-signin = { workspace = true, features = ["test-support"] }
# The loopback HTTP endpoint unmodified A2A clients use, driven against Liaison in its tests.
coqui-a2a = { workspace = true, features = ["loopback"] }
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
# The test's own one-time code, written from RFC 4226 apart from the provider.
sha1 = "0.11"
tokio-tungstenite = { workspace = true }
# Libraries to load, never to link: depending on them has Cargo build each beside the test
# binaries, where the page tests load the real page authenticators.
coqui-access-mtls-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "ac96b16ff93fdf63a0d13c2ccdff635d29a437e6" }
coqui-access-proxy-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "ac96b16ff93fdf63a0d13c2ccdff635d29a437e6" }
coqui-access-signin-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "ac96b16ff93fdf63a0d13c2ccdff635d29a437e6" }
