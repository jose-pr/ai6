# coqui-access/crates/coqui-access-signin at 35986e115d0214db7e4885d6a7976e0d771edb9b, with what it inherits written out.
[package]
name = "coqui-access-signin"
description = "Sign-in rules: which methods a sign-in may use from where it is made, and what it still needs"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.coqui-net-acl]
git = "https://github.com/Boriken-Dev/coqui-net-acl"
rev = "839435acc29b76ec0190b7099f870863313d3fcd"
[dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
[features]
test-support = []
[dev-dependencies]
[dev-dependencies.coqui-access-signin]
path = "."
features = ["test-support"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
default-features = false
features = ["json"]
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
