# coqui-access/crates/coqui-access-kit at 89e4356e8123b8e4d597094e752344bc476f5084, with what it inherits written out.
[package]
name = "coqui-access-kit"
description = "Building blocks for access providers: typed tables, key and password hashing, generated secrets and private atomic files"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
[dependencies.argon2]
version = "0.6"
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.data-encoding]
version = "2.11"
[dependencies.getrandom]
version = "0.4"
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "1cf0f67f0354d18fbc5684a9a36177afbb20a0fa"
default-features = false
optional = true
[dependencies.moka]
version = "0.12"
default-features = false
features = ["sync"]
optional = true
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.sha2]
version = "0.11.1"
default-features = false
[dependencies.subtle]
version = "2.6"
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.libc]
version = "0.2"
[features]
default = []
file = ["dep:guatiao-serde", "dep:serde"]
cache = ["dep:moka"]
[dev-dependencies]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "1cf0f67f0354d18fbc5684a9a36177afbb20a0fa"
default-features = false
features = ["json"]
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.tempfile]
version = "3"
[dev-dependencies.toml]
version = "1"
