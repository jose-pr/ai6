# coqui-access/crates/coqui-access-kit at 253add5b09384ee73a89e7ea2880e430e3976fbd, with what it inherits written out.
[package]
name = "coqui-access-kit"
description = "Building blocks for access providers: typed tables, key and password hashing, generated secrets and private atomic files"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
[dependencies.argon2]
version = "0.6"
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.data-encoding]
version = "2.11"
[dependencies.getrandom]
version = "0.4"
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
optional = true
[dependencies.moka]
version = "0.12"
default-features = false
features = ["sync"]
optional = true
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
optional = true
[dependencies.sha2]
version = "0.11.1"
default-features = false
[dependencies.subtle]
version = "2.6"
[features]
default = []
file = ["dep:guatiao-serde", "dep:serde"]
cache = ["dep:moka"]
[dev-dependencies]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
features = ["json"]
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.tempfile]
version = "3"
[dev-dependencies.toml]
version = "1"
