# coqui-access/providers/access/proxy at ce68969a397073dcef0a37fb00a83888b767e273, with what it inherits written out.
[package]
name = "coqui-access-proxy"
description = "Trusted reverse-proxy identity headers as an authenticator"
readme = "README.md"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-access-kit]
path = "crates/coqui-access-kit"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
[dependencies.coqui-net-acl]
git = "https://github.com/Boriken-Dev/coqui-net-acl"
rev = "839435acc29b76ec0190b7099f870863313d3fcd"
[dependencies.coqui-peer-tls]
git = "https://github.com/Boriken-Dev/coqui-peer-tls"
rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d"
features = ["fields"]
[dependencies.data-encoding]
version = "2.11"
[dependencies.percent-encoding]
version = "2.3"
[dependencies.rustls-pki-types]
version = "1.15"
default-features = false
features = ["std"]
[dev-dependencies]
[dev-dependencies.rcgen]
version = "0.14"
