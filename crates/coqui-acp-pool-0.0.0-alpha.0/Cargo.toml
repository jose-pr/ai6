# coqui-acp/crates/coqui-acp-pool at 171e08ec92af4044377bcae77e9fb6aa391ca499, with what it inherits written out.
[package]
name = "coqui-acp-pool"
description = "The policy that picks which agent, account and model serves a session or task from a pool, and moves a running session on when its usage runs out: pure, with no I/O, secrets or clock"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "pool", "usage", "scheduling"]
categories = ["algorithms", "development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = ["std"]
std = []
[dependencies]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.coqui-acp-history]
path = "../coqui-acp-history"
[dependencies.serde_json]
version = "1"
[dev-dependencies]
[dev-dependencies.proptest]
version = "1"
default-features = false
features = ["std"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
