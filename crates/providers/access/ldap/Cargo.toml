[package]
name = "ai6-access-ldap"
description = "Authenticate AI6 accounts against LDAP or Active Directory"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false, features = ["station-tls"] }
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
rustls.workspace = true
serde.workspace = true

[dev-dependencies]
tempfile = "3"
