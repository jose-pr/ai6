[package]
name = "ai6-access-local"
description = "Local AI6 accounts with Argon2id password verification and group lookup"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false }
argon2 = "0.6"
serde.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
