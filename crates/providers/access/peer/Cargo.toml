[package]
name = "ai6-access-peer"
description = "Map verified AI6 station certificates to directory identities"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false, features = ["station-tls"] }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
