[package]
name = "ai6-source-jira"
description = "An AI6 Source provider that takes labeled Jira issues as Missions and comments the outcome back"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false }
data-encoding = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
ai6 = { path = "../../../ai6", features = ["daemon"] }
