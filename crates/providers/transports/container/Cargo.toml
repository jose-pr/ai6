[package]
name = "ai6-transport-container"
description = "An AI6 transport provider for a running Docker or Podman container: commands and files through exec"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
ai6 = { path = "../../../ai6", features = ["daemon"] }
tempfile.workspace = true
