[package]
name = "ai6-transport-local"
description = "An AI6 transport provider for the Station's own host: run commands and read and write files"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false }

[dev-dependencies]
ai6 = { path = "../../../ai6", features = ["daemon"] }
tempfile.workspace = true
