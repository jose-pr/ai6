[package]
name = "ai6-agent-codex"
description = "Codex app-server AgentHandler provider for AI6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ai6 = { path = "../../../ai6", default-features = false, features = ["gate"] }
serde_json.workspace = true

[dev-dependencies]
ai6 = { path = "../../../ai6", features = ["daemon"] }
