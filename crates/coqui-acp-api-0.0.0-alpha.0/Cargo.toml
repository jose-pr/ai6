# coqui-acp/crates/coqui-acp-api at 2972b6ad93cd5a922469bfedb12fc2949024d5f5, with what it inherits written out.
bin = [{ name = "acp-harness-check", required-features = ["contract"] }]
example = [{ name = "echo_harness", crate-type = ["cdylib"] }]
test = [{ name = "echo", required-features = ["contract"] }, { name = "check", required-features = ["contract"] }]
[package]
name = "coqui-acp-api"
description = "coqui-acp's Guatiao kinds: acp_harness, an Agent Client Protocol agent driver written in any language Guatiao hosts and started over a channel of ACP messages, and the spawner its programs start through"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "harness", "guatiao", "plugin"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "__pycache__"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
contract = ["dep:serde_json", "dep:guatiao-serde", "dep:coqui-acp", "dep:rustix", "dep:win32job", "guatiao/load"]
[dependencies]
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
features = ["provider"]
[dependencies.guatiao-channel]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.coqui-acp]
path = "../coqui-acp"
optional = true
[dependencies.serde_json]
version = "1"
optional = true
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
optional = true
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
optional = true
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.win32job]
version = "2.0.3"
optional = true
[dev-dependencies]
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
