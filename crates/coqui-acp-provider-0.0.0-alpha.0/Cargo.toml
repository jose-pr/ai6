# coqui-acp/crates/coqui-acp-provider at 981a64ad05a4039f674d9ca204bf4aaeb6db7398, with what it inherits written out.
example = [{ name = "echo_provider", crate-type = ["cdylib"] }]
[package]
name = "coqui-acp-provider"
description = "Agents as Guatiao providers, in any language Guatiao hosts, and a facade that serves one over the Agent Client Protocol"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "provider", "guatiao"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "__pycache__"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
[dependencies.agent-client-protocol]
version = "3.6"
default-features = false
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.futures]
version = "0.3"
[dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
features = ["provider"]
[dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
default-features = false
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.serde_json]
version = "1"
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "0350bae7fef4cef2aa46ce73f1ef6be15983d83b"
features = ["provider", "load"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
