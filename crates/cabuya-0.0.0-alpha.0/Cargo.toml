# cabuya/. at 5fb2a34cb2b3fb5b289b6958c145a5f124ff5879, with what it inherits written out.
bin = [{ name = "cabuya", path = "src/bin/cabuya/main.rs", required-features = ["cli"] }]
test = [{ name = "cli", required-features = ["cli"] }, { name = "pairing", required-features = ["sealed"] }, { name = "interop", required-features = ["sealed", "forward"] }, { name = "asked", required-features = ["sealed"] }, { name = "shared", required-features = ["sealed"] }]
[package]
name = "cabuya"
description = "A proven link between two peers, and named streams over it: any protocol, no agent library"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/cabuya"
homepage = "https://boriken-dev.github.io/cabuya/"
readme = "README.md"
keywords = ["peer", "mux", "streams", "noise", "pairing"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
sealed = ["dep:coqui-peer", "dep:coqui-builder", "dep:coqui-peer-noise", "dep:coqui-peer-webcrypto"]
forward = ["dep:socket2", "dep:coqui-net-acl"]
cli = ["sealed", "forward", "dep:clap"]
[dependencies]
serde_json = "1"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "be72492c89a5a657deb8027aee3c6db27ac14b2f"
optional = true
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
optional = true
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "d5e8cc4792f7d6e69921822da59ee6e10324cb9a"
features = ["pin"]
optional = true
[dependencies.coqui-peer-noise]
git = "https://github.com/Boriken-Dev/coqui-peer-noise"
rev = "ed93715e900b68b040db6e8f8dcdf1a60a38b182"
features = ["pin"]
optional = true
[dependencies.socket2]
version = "0.6"
optional = true
[dependencies.coqui-net-acl]
git = "https://github.com/Boriken-Dev/coqui-net-acl"
rev = "839435acc29b76ec0190b7099f870863313d3fcd"
optional = true
[dependencies.clap]
version = "4"
default-features = false
features = ["std", "derive", "help", "usage", "error-context"]
optional = true
[dev-dependencies]
proptest = "1"
[dev-dependencies.agentic-peer]
package = "coqui-agentic-peer"
git = "https://github.com/Boriken-Dev/agentic-peer"
rev = "f45938e8cede85a2a2e00afedea1b4944f7c8a67"
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
