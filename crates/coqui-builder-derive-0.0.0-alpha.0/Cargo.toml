# coqui-builder/crates/coqui-builder-derive at c1875f8276bd6366c38e9133fdb1181a0ffbaaad, with what it inherits written out.
[package]
name = "coqui-builder-derive"
description = "Derives for coqui-builder: describe, fill and build any struct field by field"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-builder"
readme = "README.md"
exclude = [".*", "*.local.*"]
publish = false
[lib]
name = "coqui_builder_derive"
path = "src/lib.rs"
proc-macro = true
[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
[dev-dependencies]
serde_json = "1"
[dev-dependencies.syn]
version = "2"
features = ["full"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"
