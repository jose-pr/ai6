# coqui-access/providers/access/password/plugin at e0b452292306df7d70b3bb64670c16300bb415f3, with what it inherits written out.
[package]
name = "coqui-access-password-plugin"
description = "coqui-access-password as a library a host loads"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[lib]
crate-type = ["cdylib"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
[dependencies.coqui-access-password]
path = ".."
[dependencies.coqui-access-kit]
path = "crates/coqui-access-kit"
features = ["file"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.serde_json]
version = "1"
[dependencies.toml]
version = "1"
[dev-dependencies]
[dev-dependencies.tempfile]
version = "3"
