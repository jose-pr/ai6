# coqui-agentic-peer/crates/coqui-agentic-peer at 2966a25c956678e44e23faf3757d2b34c6a769f3, with what it inherits written out.
[package]
name = "coqui-agentic-peer"
description = "A proven link between two peers: pair once, then ACP, A2A, MCP or anything else over it"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-agentic-peer"
homepage = "https://boriken-dev.github.io/coqui-agentic-peer/"
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[dependencies]
mdns-sd = "0.21"
serde_json = "1"
socket2 = "0.6"
url = "2.5"
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681"
features = ["pin"]
[dependencies.coqui-peer-noise]
git = "https://github.com/Boriken-Dev/coqui-peer-noise"
rev = "3a5b30689780a6e6291af565ff6abbaae515973c"
features = ["pin"]
[dependencies.coqui-web-channel]
git = "https://github.com/Boriken-Dev/coqui-web-channel.git"
rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca"
[dev-dependencies]
proptest = "1"
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
