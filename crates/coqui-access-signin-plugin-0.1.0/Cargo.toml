# coqui-access/crates/coqui-access-signin/plugin at e0b452292306df7d70b3bb64670c16300bb415f3, with what it inherits written out.
[package]
name = "coqui-access-signin-plugin"
description = "coqui-access-signin as a library a host loads"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[lib]
crate-type = ["cdylib"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-access-signin]
path = ".."
[dev-dependencies]
[dev-dependencies.coqui-access]
path = "crates/coqui-access"
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
default-features = false
features = ["json"]
[dev-dependencies.serde_json]
version = "1"
