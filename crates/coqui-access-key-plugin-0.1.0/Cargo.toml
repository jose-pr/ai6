# coqui-access/providers/access/key/plugin at ce68969a397073dcef0a37fb00a83888b767e273, with what it inherits written out.
[package]
name = "coqui-access-key-plugin"
description = "coqui-access-key as a library a host loads"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[lib]
crate-type = ["cdylib"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
[dependencies.coqui-access-key]
path = ".."
[dependencies.coqui-access-kit]
path = "crates/coqui-access-kit"
features = ["file"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.serde_json]
version = "1"
[dependencies.toml]
version = "1"
[dev-dependencies]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e"
default-features = false
features = ["json"]
[dev-dependencies.tempfile]
version = "3"
